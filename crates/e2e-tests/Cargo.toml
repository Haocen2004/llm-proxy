[package]
name = "e2e-tests"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "端到端验收测试（生命周期内专用，不发布）"
publish = false

[dependencies]

[dev-dependencies]
tokio = { workspace = true, features = [
    "rt-multi-thread", "net", "macros", "sync", "time", "io-util", "process",
] }
hyper = { workspace = true, features = ["http1", "server", "client"] }
hyper-util = { workspace = true, features = ["tokio"] }
http-body-util.workspace = true
http-body = "1"
http.workspace = true
bytes.workspace = true
futures-util = { workspace = true, features = ["std"] }
llm-proxy-core.workspace = true
# 原始 DSHP 对端要用它建会话（`Mux`、`SessionCrypto`、`connect`）。
# `FP_MISMATCH` 这类红线只有"说谎的客户端"才碰得到，HTTP 层的夹具做不到。
llm-proxy-transport.workspace = true
prost.workspace = true
anyhow.workspace = true
serde_json = "1"
flate2 = "1"
# 缺口 #4（https 上游）的夹具：需要一个**真的 TLS 上游**，而证书在测试时现生成
# （**不把私钥提交进仓库** ✓）—— rcgen 生成 CA + 叶子证书，tokio-rustls 做服务端。
#
# ⚠️ `default-features = false` **必须**：rcgen 默认用 `aws-lc-rs` ⇒ 会连带拉进
# `aws-lc-sys` + `cmake`（原生构建）✗✗ —— 那会在 CI 与交叉编译上引入一整套工具链要求。
# 本仓库其余部分统一用 `ring` ✓，这里保持一致（`pem` 用来导出 CA 的 PEM ✓）。
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem"] }
# ⚠️ 同样**必须** `default-features = false`：tokio-rustls 默认启用 rustls 的
# `aws_lc_rs` provider ⇒ workspace 内 features 会**统一**，于是**生产二进制**那条链路
# 也会编进 aws-lc-sys + cmake ✗✗（`cargo tree -i aws-lc-rs` 实测能直接看到它挂在
# `rustls ← hyper-rustls ← llm-proxy-transport` 上）。统一用 `ring` ✓。
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls.workspace = true
rustls-pemfile.workspace = true
