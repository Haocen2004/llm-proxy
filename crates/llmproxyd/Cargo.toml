[package]
name = "llmproxyd"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "DSHP 服务端：WS 入口 + 上游原样转发（egress）"

[[bin]]
name = "llmproxyd"
path = "src/main.rs"

[dependencies]
# SIMD 子串查找（usage 扫描热路径）✓ —— 本来就在依赖树里（serde_json 传递依赖）⇒ 不新增代码 ✓
memchr.workspace = true
llm-proxy-core.workspace = true
llm-proxy-cache.workspace = true
llm-proxy-json.workspace = true
llm-proxy-transport.workspace = true
prost.workspace = true
tokio = { workspace = true, features = [
    "rt-multi-thread", "net", "macros", "sync", "time", "io-util", "signal",
] }
hyper = { workspace = true, features = ["http1", "client", "server"] }
hyper-util = { workspace = true, features = ["tokio"] }
http-body-util.workspace = true
http.workspace = true
bytes.workspace = true
base64.workspace = true
futures-util = { workspace = true, features = ["std"] }
futures-channel.workspace = true
http-body = "1"
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
