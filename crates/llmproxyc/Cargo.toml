[package]
name = "llmproxyc"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "DSHP 客户端：本地反向代理入口（跑在 ARM 软路由）"

[[bin]]
name = "llmproxyc"
path = "src/main.rs"

[dependencies]
llm-proxy-core.workspace = true
llm-proxy-cache.workspace = true
llm-proxy-json.workspace = true
llm-proxy-transport.workspace = true
prost.workspace = true
tokio = { workspace = true, features = [
    "rt-multi-thread", "net", "macros", "sync", "time", "io-util", "signal",
] }
hyper = { workspace = true, features = ["http1", "server", "client"] }
hyper-util = { workspace = true, features = ["tokio"] }
futures-channel.workspace = true
http-body = "1"
http-body-util.workspace = true
http.workspace = true
bytes.workspace = true
futures-util = { workspace = true, features = ["std"] }
clap.workspace = true
serde.workspace = true
serde_json = "1"
toml.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
