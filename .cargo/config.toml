# DSHP 的交叉编译配置。
#
# 设计 §12 把「`aarch64-unknown-linux-musl` 静态单二进制」列为**硬约束**，
# 理由是软路由上的 glibc 版本完全不可控：动态链接的产物拷过去大概率直接跑不起来，
# 而静态 musl 产物 `scp` 过去即可运行，也才谈得上「低人工介入」。
#
# 为什么需要显式 linker：`zstd-sys` 会编译 zstd 的 C 源码，必须有**目标平台**的
# C 工具链。musl.cc 提供的独立工具链无需 root 安装，适合在没有 sudo 的环境里
# 复现构建。构建脚本 `scripts/build-arm.sh` 会把它放到 PATH 上。
#
# 两条工具链路径（第 180 轮补）：这里的 `linker` 是 **musl.cc 路径**的默认值；
# CI 走 zig 路径时由 `cargo-zigbuild` 设置 `CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER`
# —— **环境变量优先于本文件** ⇒ 不需要为 CI 改这个文件。

[target.aarch64-unknown-linux-musl]
# 独立 musl 工具链里的 gcc。若用其它工具链，覆盖 CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER。
linker = "aarch64-linux-musl-gcc"
# 强制静态链接 CRT。musl target 默认已倾向静态，但显式写出来才能挡住
# 「某个依赖悄悄引入动态链接」这类只在目标设备上才暴露的问题。
rustflags = ["-C", "target-feature=+crt-static"]

[target.x86_64-unknown-linux-musl]
linker = "musl-gcc"
rustflags = ["-C", "target-feature=+crt-static"]
